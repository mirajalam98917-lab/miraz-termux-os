cd ~/miraz-termux-os
cat > .github/workflows/build-apk.yml <<'EOF'
name: Build Miraz Termux OS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython

      - name: Prepare Buildozer Android SDK licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/licenses"

          cat > "$SDK/licenses/android-sdk-license" <<'LICENSE'
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          84831b9409646a918e30573bab4c9c91346d8abd
          d56f5187479451eabf01fb78af6dfcb131a6481e
          LICENSE

          echo "Android SDK license file prepared."

      - name: Build APK
        env:
          P4A_RELEASE_KEYSTORE: ""
        run: |
          buildozer -v android debug

      - name: Check APK
        if: success()
        run: |
          echo "===== APK FILES ====="
          find bin -type f -name "*.apk" -ls

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: miraz-termux-os-apk
          path: bin/*.apk
EOF
